{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Me Planejo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <div class="logo"><a href="{% url 'home' %}">ME PLANEJO</a></div>
        </div>
        <nav class="nav-center">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'home' %}#investimentos">Investimentos</a>
            <a href="{% url 'simulador' %}">Simulador</a>
            <a href="{% url 'simulador_metas' %}">Metas</a>
            <a href="{% url 'contato' %}">Contato</a>
        </nav>
        <div class="nav-right">VISITAS: {{ total_visitas }}</div>
    </header>

    <main>
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; {% now "Y" %} ME PLANEJO. Dignidade e Educação Financeira.</p>
    </footer>
</body>
</html>
