{% if evolucao %}
<details class="evolucao">
    <summary>Ver evolução mês a mês</summary>
    <div class="tabela-scroll">
        <table>
            <thead>
                <tr><th>Mês</th><th>Total aportado</th><th>Saldo bruto</th><th>IR se resgatar</th><th>Saldo líquido</th></tr>
            </thead>
            <tbody>
                {% for item in evolucao %}
                <tr>
                    <td>{{ item.mes }}</td>
                    <td>R$ {{ item.investido }}</td>
                    <td>R$ {{ item.bruto }}</td>
                    <td>R$ {{ item.ir }}</td>
                    <td style="font-weight: 700; color: #39ff14;">R$ {{ item.liquido }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</details>
{% endif %}
