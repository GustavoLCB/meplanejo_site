{% if evolucao %}
<details class="evolucao">
    <summary>Ver evolução mês a mês</summary>
    <div class="tabela-scroll">
        <table>
            <thead>
                <tr><th>Mês</th><th>Total aportado</th><th>Líquido ETF</th><th>Líquido Fundo</th></tr>
            </thead>
            <tbody>
                {% for item in evolucao %}
                <tr>
                    <td>{{ item.mes }}</td>
                    <td>R$ {{ item.investido }}</td>
                    <td>R$ {{ item.etf }}</td>
                    <td>R$ {{ item.fundo }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</details>
{% endif %}
